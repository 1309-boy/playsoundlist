name: Update Sounds (Auto From Mojang)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"   # 12시간마다 자동 업데이트 (원하면 수정 가능)

permissions:
  contents: write

jobs:
  update-sounds:
    runs-on: ubuntu-latest

    steps:
    # ----------------------------------------------------
    # 1. GitHub repo 체크아웃
    # ----------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Fetch Mojang Bedrock samples
      shell: bash
      run: |
        set -euo pipefail
        git clone --depth=1 https://github.com/Mojang/bedrock-samples.git bedrock-samples
        cp bedrock-samples/resource_pack/sounds/sound_definitions.json sound_definitions.json
        find bedrock-samples/resource_pack/sounds -type f -name '*.fsb' -print -quit

    - name: Install vgmstream
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y jq unzip

        release_api="https://api.github.com/repos/vgmstream/vgmstream/releases/latest"
        download_url=$(curl -fsSL "$release_api" | jq -r '.assets[] | select(.name == "vgmstream-linux.zip") | .browser_download_url')
        [ -n "$download_url" ] && [ "$download_url" != "null" ] || {
          echo "Could not find the vgmstream Linux release." >&2
          exit 1
        }

        curl -fsSL "$download_url" -o vgmstream.zip
        unzip -q vgmstream.zip -d vgmstream
        vgmstream_cli=$(find "$PWD/vgmstream" -type f -name vgmstream-cli -print -quit)
        [ -n "$vgmstream_cli" ] || {
          echo "vgmstream-cli was not included in the release." >&2
          exit 1
        }
        chmod +x "$vgmstream_cli"
        ln -s "$vgmstream_cli" "$PWD/vgmstream-cli"
        ./vgmstream-cli -h >/dev/null

    - name: Convert FSB files to WAV
      shell: bash
      run: |
        set -euo pipefail
        source_root="bedrock-samples/resource_pack/sounds"
        rm -rf sounds_flat
        mkdir -p sounds_flat

        total=0
        converted=0
        failed=0

        while IFS= read -r -d '' source; do
          relative="${source#${source_root}/}"
          output="sounds_flat/${relative%.fsb}.wav"
          mkdir -p "$(dirname "$output")"

          if ./vgmstream-cli -o "$output" "$source" >/dev/null 2>&1 && [ -s "$output" ]; then
            converted=$((converted + 1))
          else
            rm -f "$output"
            failed=$((failed + 1))
            echo "Failed to convert: $relative" >&2
          fi
          total=$((total + 1))
        done < <(find "$source_root" -type f -name '*.fsb' -print0)

        echo "Converted $converted of $total FSB files; $failed failed."
        [ "$total" -gt 0 ] || { echo "No FSB files found." >&2; exit 1; }
        [ "$converted" -gt 0 ] || { echo "No WAV files were created." >&2; exit 1; }
        [ "$failed" -eq 0 ] || { echo "FSB conversion was incomplete." >&2; exit 1; }

    - name: Generate site manifest
      shell: bash
      run: |
        set -euo pipefail
        find sounds_flat -type f -name '*.wav' -print | LC_ALL=C sort | \
          sed 's|^|  "|;s|$|"|' | \
          awk 'BEGIN { print "[" } { print (NR == 1 ? "" : ",") $0 } END { print "]" }' \
          > manifest.json

    # ----------------------------------------------------
    # 8. 변경사항 커밋 + Push
    # ----------------------------------------------------
    - name: Commit generated files
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add manifest.json sound_definitions.json sounds_flat/
        if git diff --cached --quiet; then
          echo "Mojang samples have not changed."
        else
          git commit -m "Auto-update sounds from Mojang samples"
          git push
        fi
