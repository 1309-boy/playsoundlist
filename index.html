  <style>
    :root { --bg:#111; --panel:#1a1a1a; --line:#2c2c2c; --muted:#aaa; --fg:#eee; --accent:#16a34a; }
    html,body{margin:0;padding:0;background:#111;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
    .wrap{max-width:960px;margin:0 auto;padding:18px;}
    h1{margin:8px 0 18px;text-align:center;color:#90caf9;font-weight:800;letter-spacing:.5px}
    .toolbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
    .search{flex:1 1 440px;max-width:560px}
    .search input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#222;color:var(--fg);outline:none}
    .pagesize select{padding:9px 10px;border-radius:10px;background:#222;border:1px solid var(--line);color:var(--fg)}
    .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin:8px 0 14px}
    .muted{color:var(--muted);font-size:.92rem}
    button{cursor:pointer}
    .btn{padding:6px 12px;border-radius:10px;border:1px solid var(--line);background:#2b2b2b;color:#eee}
    .btn:hover{background:#3a3a3a}
    .btn.play.playing{background:var(--accent);border-color:var(--accent);color:#000}
    .btn.disabled{background:#444!important;border-color:#333!important;color:#999!important;cursor:not-allowed!important;}
    .list{display:flex;flex-direction:column;gap:12px;margin-bottom:40px}
    .card{--progress-offset:1;position:relative;isolation:isolate;background:#1a1a1a;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
    .card>*{position:relative;z-index:1}
    .card>.progress-border{position:absolute;z-index:0;left:-1px;top:-1px;width:calc(100% + 2px);height:calc(100% + 2px);pointer-events:none;overflow:visible;opacity:0;transition:opacity .15s ease}
    .progress-border path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:var(--progress-offset)}
    .card.playing>.progress-border{opacity:1}
    .title{font-weight:700;margin-bottom:8px;word-break:break-word;display:flex;justify-content:space-between;align-items:center}
    .dist-label{font-size:0.9rem;color:#ccc;margin-left:10px}
    .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0}
    .label{color:var(--muted)}
    input[type="range"]{width:240px}
  </style>
</head>

<body>
  <div class="wrap">
    <h1>BE Playsound List</h1>

    <div class="toolbar">
      <div class="search"><input id="q" type="text" placeholder="Search sounds (e.g., beacon.pow, ui.loom ...)" /></div>
      <div class="pagesize">
        <select id="pagesize">
          <option>25</option><option>50</option><option selected>100</option><option>200</option>
        </select>
      </div>
    </div>

    <div class="pager">
      <button id="prev" class="btn">&lt; Prev</button>
      <div id="pageinfo" class="muted"></div>
      <button id="next" class="btn">Next &gt;</button>
    </div>

    <div id="count" class="muted" style="text-align:center;margin-bottom:10px;"></div>
    <div id="list" class="list"></div>
  </div>


<script>
/* ================= CONFIG ================== */
const GH_BASE = 'https://1309-boy.github.io/playsoundlist';
const MANIFEST_URL    = `${GH_BASE}/manifest.json`;
const DEFINITIONS_URL = `${GH_BASE}/sound_definitions.json`;

/* ================= STATE ================== */
const state = {
  items: [],
  filtered: [],
  itemsByName: new Map(),
  manifestSet: new Set(),
  page: 0,
  pageSize: 100,
};

let currentKey   = null;
let currentPlayBtn = null;

let webCtx = null;
let audioUnlocked = false;
let currentSrcNode = null;
let currentGainNode = null;
let currentBufferDuration = 0;
let currentBufferPosition = 0;
let currentPlaybackRate = 1;
let currentDefinitionPitch = 1;
let playbackAnchorTime = 0;
let progressFrame = 0;
const bufferCache = new Map();

/* ================= DOM ================== */
const $list   = document.getElementById('list');
const $count  = document.getElementById('count');
const $q      = document.getElementById('q');
const $pageinfo = document.getElementById('pageinfo');
const $prev   = document.getElementById('prev');
const $next   = document.getElementById('next');
const $pagesize = document.getElementById('pagesize');

/* ================= HELPERS ================== */
function normalizeRange(value, fallback, minimum = 0){
  if (value == null) return {min:fallback, max:fallback};
  const raw = Array.isArray(value) ? value : [value];
  const values = raw
    .filter(v=>v != null && v !== '')
    .map(Number)
    .filter(Number.isFinite)
    .map(v=>Math.max(minimum, v));

  if (!values.length) return {min:fallback, max:fallback};
  if (values.length === 1) return {min:values[0], max:values[0]};
  return {
    min: Math.min(values[0], values[1]),
    max: Math.max(values[0], values[1])
  };
}

function normalizeDefSound(s){
  if(!s) return null;
  const sound = typeof s === 'string' ? {name:s} : s;
  if(!sound.name) return null;

  const weight = sound.weight == null ? 1 : Number(sound.weight);
  return {
    name: sound.name,
    pitch: normalizeRange(sound.pitch, 1, 0.01),
    volume: normalizeRange(sound.volume, 1, 0),
    weight: Number.isFinite(weight) ? Math.max(0, weight) : 1
  };
}

function sampleRange(range, random = Math.random){
  if (!range || range.min === range.max) return range?.min ?? 1;
  return range.min + ((range.max - range.min) * random());
}

function chooseWeightedVariant(variants, random = Math.random){
  if (!variants.length) return null;

  const totalWeight = variants.reduce((sum, variant)=>sum + variant.weight, 0);
  if (totalWeight <= 0){
    return variants[Math.min(variants.length - 1, Math.floor(random() * variants.length))];
  }

  let cursor = random() * totalWeight;
  for (const variant of variants){
    cursor -= variant.weight;
    if (cursor < 0) return variant;
  }
  return variants[variants.length - 1];
}

function resolvePlaybackSettings(item, variant, commandPitch, random = Math.random){
  const requestedPitch = Number.isFinite(commandPitch) ? commandPitch : 1;
  const definitionPitch =
    sampleRange(item.pitch, random) * sampleRange(variant.pitch, random);
  const definitionVolume =
    sampleRange(item.volume, random) * sampleRange(variant.volume, random);

  return {
    definitionPitch,
    playbackRate: Math.min(256, Math.max(0.01, requestedPitch * definitionPitch)),
    // Values above 1 mainly extend Minecraft's audible range. At the listener,
    // limiting them avoids browser clipping while preserving quieter variants.
    gain: Math.min(1, Math.max(0, definitionVolume))
  };
}

function soundToBasePath(s){ return s.replace(/^sounds\//,''); }
function baseToUrl(base){ return `${GH_BASE}/sounds_flat/${base}.wav`; }

function inManifest(url){
  if (state.manifestSet.has(url)) return true;
  const rel = url.replace(`${GH_BASE}/`,'');
  if (state.manifestSet.has(rel)) return true;
  const onlyPath = url.replace(/^https?:\/\/[^/]+\//,'');
  return state.manifestSet.has(onlyPath);
}

function updateCardProgressPath(card){
  const svg = card.querySelector('.progress-border');
  const path = svg?.querySelector('path');
  if (!svg || !path) return;

  const bounds = svg.getBoundingClientRect();
  const width = bounds.width;
  const height = bounds.height;
  if (width <= 4 || height <= 4) return;

  const inset = 1;
  const left = inset;
  const top = inset;
  const right = width - inset;
  const bottom = height - inset;
  const radius = Math.min(13, (right - left) / 2, (bottom - top) / 2);
  const startX = width / 2;

  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  path.setAttribute('d', [
    `M ${startX} ${top}`,
    `H ${right - radius}`,
    `A ${radius} ${radius} 0 0 1 ${right} ${top + radius}`,
    `V ${bottom - radius}`,
    `A ${radius} ${radius} 0 0 1 ${right - radius} ${bottom}`,
    `H ${left + radius}`,
    `A ${radius} ${radius} 0 0 1 ${left} ${bottom - radius}`,
    `V ${top + radius}`,
    `A ${radius} ${radius} 0 0 1 ${left + radius} ${top}`,
    `H ${startX}`,
    'Z'
  ].join(' '));
}

const progressResizeObserver = new ResizeObserver(entries => {
  for (const entry of entries) updateCardProgressPath(entry.target);
});

/* ================= RENDER ================== */
function fmtPage(){
  const total = state.filtered.length;
  const pages = Math.max(1, Math.ceil(total / state.pageSize));
  const page  = Math.min(state.page + 1, pages);
  $pageinfo.textContent = `Page ${page} of ${pages}`;
}

function render(){
  progressResizeObserver.disconnect();
  $list.innerHTML = '';
  const start = state.page * state.pageSize;
  const end   = Math.min(start + state.pageSize, state.filtered.length);

  for (const item of state.filtered.slice(start, end)){
    const distHTML =
      (typeof item.max_distance === "number")
        ? `<span class="dist-label">(distance = ${item.max_distance})</span>`
        : ``;

    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.key = item.name;

    const missingAudio = item.files_missing ? true : false;

    card.innerHTML = `
      <svg class="progress-border" aria-hidden="true">
        <path pathLength="1"></path>
      </svg>

      <div class="title">
        <span>${item.name}</span>
        ${distHTML}
      </div>

      <div class="row">
        <button class="btn play ${missingAudio ? "disabled" : ""}">${missingAudio ? "🚫" : "Play"}</button>
        <button class="btn stop">Stop</button>
      </div>

      <div class="row">
        <span class="label">Pitch:</span>
        <input class="pitch" type="range" min="0.1" max="2.0" step="0.1" value="1.0"/>
        <span class="pitch-val">1.0</span>
      </div>
    `;

    $list.appendChild(card);
    updateCardProgressPath(card);
    progressResizeObserver.observe(card);
  }

  $count.textContent = `Showing ${start+1}-${end} of ${state.filtered.length} sounds`;
  fmtPage();
}

/* ================= EVENTS ================== */
$q.addEventListener('input', applyFilter);

$pagesize.addEventListener('change', ()=>{
  state.pageSize = parseInt($pagesize.value,10);
  state.page = 0;
  render();
});

$prev.addEventListener('click', ()=>{ if (state.page>0){ state.page--; render(); }});
$next.addEventListener('click', ()=>{
  const pages = Math.ceil(state.filtered.length / state.pageSize);
  if (state.page < pages-1){ state.page++; render(); }
});

document.addEventListener('input',(e)=>{
  if (!e.target.matches('.pitch')) return;
  const card = e.target.closest('.card');
  const key  = card.dataset.key;
  card.querySelector('.pitch-val').textContent = e.target.value;

  if (currentSrcNode && currentKey === key){
    setCurrentPlaybackRate(parseFloat(e.target.value || '1.0'));
  }
});

document.addEventListener('click',(e)=>{
  const playBtn = e.target.closest('.btn.play');
  if (playBtn){
    if (playBtn.classList.contains('disabled')){
      alert("Audio file not provided for this sound.");
      return;
    }
    const card = playBtn.closest('.card');
    playKey(card.dataset.key, playBtn);
    return;
  }

  const stopBtn = e.target.closest('.btn.stop');
  if (stopBtn){
    const card = stopBtn.closest('.card');
    stopKey(card.dataset.key);
  }
});

/* ================= AUDIO UNLOCK ================== */
['pointerdown','touchstart','keydown','mousedown'].forEach(evt=>{
  window.addEventListener(evt, unlockAudio, { once:true, passive:true });
});

async function unlockAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !webCtx) webCtx = new AC();
    if (webCtx?.state === 'suspended') await webCtx.resume();

    const buf = webCtx.createBuffer(1,1,22050);
    const src = webCtx.createBufferSource();
    src.buffer = buf; src.connect(webCtx.destination); src.start(0);

    audioUnlocked = true;
  }catch(_){}
}

/* ================= WEB AUDIO ================== */
async function getBuffer(url){
  if (bufferCache.has(url)) return bufferCache.get(url);
  const r = await fetch(url, {cache:'force-cache'});
  if (!r.ok) throw new Error('fetch fail');
  const ab = await r.arrayBuffer();
  const buf = await webCtx.decodeAudioData(ab);
  bufferCache.set(url, buf);
  return buf;
}

function getCurrentBufferPosition(){
  if (!webCtx || !currentSrcNode) return currentBufferPosition;
  const advanced = Math.max(0, webCtx.currentTime - playbackAnchorTime) * currentPlaybackRate;
  return Math.min(currentBufferDuration, currentBufferPosition + advanced);
}

function setCurrentPlaybackRate(rate){
  if (!currentSrcNode || !webCtx) return;
  currentBufferPosition = getCurrentBufferPosition();
  playbackAnchorTime = webCtx.currentTime;
  currentPlaybackRate = Math.min(
    256,
    Math.max(0.01, (rate || 1) * currentDefinitionPitch)
  );
  currentSrcNode.playbackRate.setValueAtTime(currentPlaybackRate, webCtx.currentTime);
}

function resetCardProgress(key){
  if (!key) return;
  const card = document.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
  if (!card) return;
  card.classList.remove('playing');
  card.style.setProperty('--progress-offset','1');
  card.querySelector('.btn.play')?.classList.remove('playing');
}

function updatePlaybackProgress(){
  if (!currentSrcNode || !currentKey || currentBufferDuration <= 0) return;

  const position = getCurrentBufferPosition();
  const progress = Math.min(1, position / currentBufferDuration);
  const card = document.querySelector(`.card[data-key="${CSS.escape(currentKey)}"]`);

  if (card){
    card.classList.add('playing');
    card.style.setProperty('--progress-offset',String(1 - progress));
    const playBtn = card.querySelector('.btn.play');
    playBtn?.classList.add('playing');
    if (playBtn) currentPlayBtn = playBtn;
  }

  progressFrame = requestAnimationFrame(updatePlaybackProgress);
}

function stopCurrent(){
  const stoppedKey = currentKey;
  const stoppedSource = currentSrcNode;
  if (progressFrame) cancelAnimationFrame(progressFrame);
  progressFrame = 0;
  currentSrcNode = null;
  currentKey = null;
  if (stoppedSource){
    stoppedSource.onended = null;
    try{ stoppedSource.stop(0); }catch(_){}
    stoppedSource.disconnect?.();
  }
  currentGainNode?.disconnect?.();
  currentGainNode = null;
  if (currentPlayBtn) currentPlayBtn.classList.remove('playing');
  currentPlayBtn = null;
  currentBufferDuration = 0;
  currentBufferPosition = 0;
  currentPlaybackRate = 1;
  currentDefinitionPitch = 1;
  playbackAnchorTime = 0;
  resetCardProgress(stoppedKey);
}

/* ================= PLAY ================== */
async function playKey(key, btn){
  const item = state.itemsByName.get(key);
  if (!item) return;

  if (item.files_missing){
    alert("Audio file not provided for this sound.");
    return;
  }

  const variant = chooseWeightedVariant(item.variants);
  if (!variant || !inManifest(variant.url)) return;

  await unlockAudio();

  stopCurrent();

  const card = document.querySelector(`.card[data-key="${CSS.escape(key)}"]`);
  const commandPitch = parseFloat(card.querySelector('.pitch').value || '1.0');
  const settings = resolvePlaybackSettings(item, variant, commandPitch);

  try{
    const buf = await getBuffer(variant.url);
    const src = webCtx.createBufferSource();
    const gain = webCtx.createGain();
    src.buffer = buf;
    src.playbackRate.value = settings.playbackRate;
    gain.gain.value = settings.gain;
    src.connect(gain);
    gain.connect(webCtx.destination);

    currentSrcNode = src;
    currentGainNode = gain;
    currentKey = key;
    currentPlayBtn = btn;
    currentBufferDuration = buf.duration;
    currentBufferPosition = 0;
    currentPlaybackRate = settings.playbackRate;
    currentDefinitionPitch = settings.definitionPitch;
    playbackAnchorTime = webCtx.currentTime;
    btn.classList.add('playing');
    card.classList.add('playing');

    src.onended = ()=> stopCurrent();
    src.start(0);
    updatePlaybackProgress();
  }catch(err){
    stopCurrent();
  }
}

function stopKey(key){
  if (currentKey === key){
    stopCurrent();
  }
}

/* ================= FILTER ================== */
function applyFilter(){
  const q = ($q.value || '').toLowerCase().trim();
  state.filtered = !q ? state.items.slice()
                      : state.items.filter(it => it.name.toLowerCase().includes(q));
  state.page = 0;
  render();
}

/* ================= LOAD ================== */
async function loadManifest(){
  const r = await fetch(MANIFEST_URL,{cache:'no-store'});
  const j = await r.json();
  const urls = Array.isArray(j)
    ? j
    : j.entries?.map(e=>e.url) || j.urls || j.files || [];
  state.manifestSet = new Set(urls);
}

async function loadDefinitions(){
  const r = await fetch(DEFINITIONS_URL,{cache:'no-store'});
  const defs = (await r.json()).sound_definitions;

  const items = [];
  const map = new Map();

  for (const [name, def] of Object.entries(defs)){
    if (!Array.isArray(def.sounds)) continue;

    const variants = def.sounds
      .map(normalizeDefSound)
      .filter(Boolean)
      .map(sound=>{
        const base = soundToBasePath(sound.name);
        return {...sound, base, url:baseToUrl(base)};
      })
      .filter(variant=>variant.base && inManifest(variant.url));

    const missing = variants.length === 0;

    const maxDist =
      typeof def.max_distance === "number"
        ? def.max_distance
        : null;

    const item = {
      name,
      variants,
      pitch: normalizeRange(def.pitch, 1, 0.01),
      volume: normalizeRange(def.volume, 1, 0),
      files_missing: missing,
      max_distance: maxDist
    };

    items.push(item);
    map.set(name, item);
  }

  items.sort((a,b)=>a.name.localeCompare(b.name));
  state.items = items;
  state.itemsByName = map;
  state.filtered = items.slice();
}

/* ================= INIT ================== */
(async function init(){
  await loadManifest();
  await loadDefinitions();
  render();
})();
</script>

</body>
</html>
